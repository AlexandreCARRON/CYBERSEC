name: Metatron

on:
  pull_request:
    paths:
      - "metatron/**"
      - ".github/workflows/metatron.yml"
  push:
    branches: [main]
    paths:
      - "metatron/**"
      - ".github/workflows/metatron.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: metatron/src
        run: python -m unittest discover -s metatron/tests -v
