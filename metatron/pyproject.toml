[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metatron-pentest"
version = "0.1.0"
description = "Assistant de test d'intrusion à périmètre autorisé"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Alexandre Carron" }]
dependencies = []

[project.optional-dependencies]
ai = ["openai>=2.0,<3"]
dev = []

[project.scripts]
metatron = "metatron.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
